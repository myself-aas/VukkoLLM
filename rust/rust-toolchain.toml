# Pinned so every machine and CI build produce the same shipped library.
# Bump deliberately, together with RUST_VERSION in .github/workflows/rust.yml.
[toolchain]
channel = "1.79.0"
components = ["rustfmt", "clippy"]
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
]
