[workspace]
members = [
    "crates/vukko-core",
    "crates/vukko-db",
    "crates/vukko-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "SEE LICENSE IN ../../LICENSE"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled", "serde_json", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
strip = "none"
debug = 1
