name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# The Gradle project is the repository root, not `android/`: `settings.gradle.kts`
# and `gradle/libs.versions.toml` are at the top level and `:app` is the Kotlin
# host that actually ships today. The React Native host the migration targets
# (`android/app/...` in MIGRATION_PLAN.md) is generated in phase 1 and is not in
# the tree yet. Pointing `working-directory` at it made every step fail before it
# ran a single command — "An error occurred trying to start process
# '/usr/bin/bash' with working directory '.../android'" — which says nothing
# about the code.
#
# There is no `gradlew` in the tree either, so this cannot call the wrapper.
# `gradle/actions/setup-gradle` downloads the distribution, puts `gradle` on PATH
# and caches `~/.gradle`, which is all the wrapper would have done here.
jobs:
  build:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # app/build.gradle.kts compiles with `JavaVersion.VERSION_21` and
      # `jvmTarget = "21"`: a 17 JDK fails with "invalid target release: 21".
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # AGP 8.9 (gradle/libs.versions.toml) requires Gradle 8.11.1 or newer.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # `signingConfigs.debugConfig` signs from `${rootDir}/debug.keystore`, which
      # is not committed: a keystore in git is a build artefact nobody can
      # rotate. The debug keystore is public by definition, so generating it here
      # produces the same APK a developer gets locally.
      - name: Create the debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # No Rust toolchain here: the Kotlin module does not link the Rust
      # libraries yet (no `externalNativeBuild`, no `jniLibs`). Installing one
      # only made the cache action fail on a missing root `Cargo.toml`.
      - name: Build the debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vukko-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
