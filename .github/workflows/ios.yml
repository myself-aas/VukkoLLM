name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS build
    # `macos-14` is retired for this repository: the run fails before setup with
    # "The configuration 'macos-14-arm64-us-default' is not supported".
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The React Native iOS host is generated in MIGRATION_PLAN.md phase 1 and
      # is not in the tree yet: there is no `ios/`, no Podfile and no workspace.
      # `working-directory: ios` used to make this job die with "No such file or
      # directory" before running anything, which reads like a broken build when
      # in fact nothing has been built yet. The absence is reported once, as a
      # notice on the run, and the build steps below are skipped instead of
      # pretending to pass. Delete this gate together with the first `ios/`
      # commit — the steps after it are already the real build.
      - name: Check for the iOS host
        id: host
        run: |
          if [ -d ios ] && [ -f ios/Podfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=iOS host not generated::ios/ (Podfile, workspace) is not in the tree yet; nothing to build. See MIGRATION_PLAN.md phase 1."
          fi

      - uses: actions/setup-node@v5
        if: steps.host.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Toolchain and targets come from rust/rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.host.outputs.present == 'true'

      - run: npm ci
        if: steps.host.outputs.present == 'true'

      - name: CocoaPods
        if: steps.host.outputs.present == 'true'
        working-directory: ios
        run: |
          pod install --repo-update

      - name: xcodebuild (simulator)
        if: steps.host.outputs.present == 'true'
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Vukko.xcworkspace \
            -scheme Vukko \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
