name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Signing keys exist only inside this environment's secrets, so a release
  # cannot be produced from a pull request.
  android:
    name: Signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.79.0
          target: aarch64-linux-android, armv7-linux-androideabi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-release-${{ runner.os }}-

      - run: npm ci

      - name: Restore the keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/vukko-release.keystore

      - name: Assemble the release bundle
        working-directory: android
        env:
          VUKKO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VUKKO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VUKKO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vukko-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
