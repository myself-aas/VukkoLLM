name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint -- --max-warnings 25

      - name: Prettier
        run: npm run format:check

      - name: JavaScript suite runs here too, so a lint-only branch cannot be green
        run: npm test -- --ci --runInBand
