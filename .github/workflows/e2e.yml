name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The plan's minimum scenario, split: everything that can run on the JVM
  # runner without a device runs here, and the device leg follows it.
  contract:
    name: End-to-end scenario over the bridge contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Fresh install → onboarding → send → stream → restart → export → integrity → backup → legacy upgrade
        run: npx jest tests/e2e --ci --runInBand

  emulator:
    name: Android emulator smoke test
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The Gradle root is the repository root and there is no committed wrapper;
      # see the comment at the top of android.yml.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create the debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build the debug APK for the emulator
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # There are no instrumentation tests in the tree (`app/src/androidTest`
      # does not exist), so `connectedDebugAndroidTest` had nothing to run and
      # the leg proved nothing. What the smoke test has to prove is that the
      # shipped APK installs on a device and its launcher activity survives being
      # started — which is what this does, with the logcat of the crash printed
      # instead of a bare exit code.
      - name: Instrumented smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            set -uo pipefail
            package=com.aistudio.vukko.kzmp
            component=$package/com.vukko.MainActivity

            fail() {
              echo "::error::$1"
              echo "--- logcat ---"
              adb logcat -d -v brief | tail -n 300
              adb exec-out screencap -p > emulator-failure.png || true
              exit 1
            }

            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk \
              || fail "the debug APK did not install"

            adb logcat -c
            launch=$(adb shell am start -W -n "$component") \
              || fail "the launcher activity did not start"
            echo "$launch"
            echo "$launch" | grep -q 'Status: ok' \
              || fail "the launcher activity did not report a successful start"

            # A launch that immediately dies still reports `Status: ok`, so the
            # process has to be alive after the start returns.
            sleep 5
            pid=$(adb shell pidof "$package" | tr -d '\r')
            [ -n "$pid" ] || fail "the app process exited after launching"
            echo "app is running as pid $pid"

            # The resumed activity is the one on screen; a crash-and-restart
            # cycle would leave the process alive but nothing resumed.
            adb shell dumpsys activity activities \
              | grep -E "ResumedActivity.*\b$package\b" \
              || fail "no Vukko activity is resumed after launch"

      - name: Keep the emulator screenshot of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-failure
          path: emulator-failure.png
          if-no-files-found: ignore
          retention-days: 7
