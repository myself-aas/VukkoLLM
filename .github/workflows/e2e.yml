name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The plan's minimum scenario, split: everything that can run on the JVM
  # runner without a device runs here, and the device leg follows it.
  contract:
    name: End-to-end scenario over the bridge contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - name: Fresh install → onboarding → send → stream → restart → export → integrity → backup → legacy upgrade
        run: npx jest tests/e2e --ci --runInBand

  emulator:
    name: Android emulator smoke test
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The Gradle root is the repository root and there is no committed wrapper;
      # see the comment at the top of android.yml.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create the debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build the debug APK for the emulator
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # There are no instrumentation tests in the tree (`app/src/androidTest`
      # does not exist), so `connectedDebugAndroidTest` had nothing to run and
      # the leg proved nothing. The smoke test is a script, not inline, because
      # this action hands `script:` to `/usr/bin/sh` one line at a time — a
      # multi-line function definition there fails with a shell syntax error
      # before it does anything.
      - name: Instrumented smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: sh scripts/android-smoke-test.sh

      - name: Keep the emulator screenshot of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-failure
          path: emulator-failure.png
          if-no-files-found: ignore
          retention-days: 7
