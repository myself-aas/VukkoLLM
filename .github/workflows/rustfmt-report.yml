name: rust diagnostics

# Temporary diagnostic, deleted once the numbers below are zero.
#
# This repository is maintained from an environment without a Rust toolchain and
# static.rust-lang.org is unreachable there, so `cargo fmt` and `cargo clippy`
# cannot be run before a push. This workflow runs both with the pinned toolchain
# and posts a compact report as a pull-request comment: clippy findings collapsed
# to one line per lint (a count and the first location), because the raw output
# is far too long for a comment. The real gates stay in rust.yml; this file
# cannot make anything pass.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: Report formatting and clippy findings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Collect the report
        working-directory: rust
        run: |
          set +e
          {
            rustc --version
            echo
            echo '=== cargo fmt --all --check ==='
            cargo fmt --all --check 2>&1 | head -40
            echo "fmt exit: ${PIPESTATUS[0]}"
            echo
            echo '=== cargo clippy -- -D warnings (grouped) ==='
          } > /tmp/report.md

          # `--message-format=short` prints one line per finding, with an
          # absolute path: match the ": warning:" / ": error:" marker, not a
          # leading directory name.
          cargo clippy --all-targets --all-features --message-format=short > /tmp/clippy.raw 2>&1
          clippy_status=$?
          grep -E ': (warning|error):' /tmp/clippy.raw > /tmp/clippy.txt
          echo "clippy exit: $clippy_status" >> /tmp/report.md
          echo '```' >> /tmp/report.md
          echo "total findings: $(wc -l < /tmp/clippy.txt)" >> /tmp/report.md
          # One line per distinct lint, with its count and first location.
          sed -E 's/^[^ ]+ //' /tmp/clippy.txt | sed -E 's/^warning: //;s/^error: //' \
            | sed -E "s/.*\[([a-z_:]+)\]$/\1/" | sort | uniq -c | sort -rn >> /tmp/report.md
          echo '```' >> /tmp/report.md
          echo 'First occurrence of each lint:' >> /tmp/report.md
          echo '```' >> /tmp/report.md
          grep -oE '\[[a-z_:]+\]$' /tmp/clippy.txt | sort -u > /tmp/lints.txt
          while read -r lint; do
            name=$(echo "$lint" | tr -d '[]')
            grep -m1 -F "$lint" /tmp/clippy.txt >> /tmp/report.md
          done < /tmp/lints.txt
          echo '```' >> /tmp/report.md
          # Anything clippy printed that is not a finding (a build failure, a
          # missing dependency) is the reason the gate would fail, so keep it.
          echo 'Last lines of raw output:' >> /tmp/report.md
          echo '```' >> /tmp/report.md
          tail -15 /tmp/clippy.raw >> /tmp/report.md
          echo '```' >> /tmp/report.md
          exit 0

      - name: Post the report on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file /tmp/report.md --repo "$GITHUB_REPOSITORY"
